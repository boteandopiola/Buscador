<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador de Artículos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #063c57;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #ffffff;
    }
    #buscador {
      display: block;
      margin: 20px auto;
      padding: 10px;
      width: 300px;
      font-size: 16px;
    }
    .contenedor {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .tarjeta {
      background: white;
      border-radius: 10px;
      width: 200px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      text-align: center;
    }
    .tarjeta img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .tarjeta img:hover {
      transform: scale(1.05);
    }
    .precio {
      color: green;
      font-weight: bold;
    }
    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }
    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }
    .modal.active {
      display: flex;
    }
  </style>
</head>
<body>

  <h1>Buscador LiteShop</h1>

  <input type="text" id="buscador" placeholder="Buscar por descripción...">

  <div class="contenedor" id="contenedor">Cargando artículos...</div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <img id="imagenModal">
  </div>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbxNHxr0hLsYZKOM0e3R2VTee39kWEYya7aycmed7smbXqcQfEpAnOU6E8vU8dz7oXOd/exec";

    let articulos = [];

    const contenedor = document.getElementById("contenedor");
    const buscador = document.getElementById("buscador");
    const modal = document.getElementById("modal");
    const imagenModal = document.getElementById("imagenModal");

    // Función para obtener los datos desde Google Sheets
    async function cargarArticulos() {
      try {
        const respuesta = await fetch(URL_API);
        articulos = await respuesta.json();
        mostrarArticulos(articulos);
      } catch (error) {
        contenedor.innerHTML = "<p>Error al cargar los artículos.</p>";
        console.error(error);
      }
    }

    function mostrarArticulos(lista) {
      contenedor.innerHTML = "";

      if (lista.length === 0) {
        contenedor.innerHTML = "<p>No se encontraron artículos.</p>";
        return;
      }

      lista.forEach(art => {
        const tarjeta = document.createElement("div");
        tarjeta.classList.add("tarjeta");

        tarjeta.innerHTML = `
          <img src="${art.foto}" alt="imagen">
          <h3>${art.descripcion}</h3>
          <p>Código: ${art.codigo}</p>
          <p class="precio">$${art.precio}</p>
        `;

        // Evento click en imagen
        const img = tarjeta.querySelector("img");
        img.addEventListener("click", () => {
          imagenModal.src = art.foto;
          modal.classList.add("active");
        });

        contenedor.appendChild(tarjeta);
      });
    }

    // Cerrar modal al hacer click fuera
    modal.addEventListener("click", () => {
      modal.classList.remove("active");
    });

    buscador.addEventListener("input", () => {
      const texto = buscador.value.toLowerCase();

      const filtrados = articulos.filter(art =>
        String(art.descripcion).toLowerCase().includes(texto)
      );

      mostrarArticulos(filtrados);
    });

    // Iniciar carga de datos
    cargarArticulos();
  </script>

</body>
</html>
